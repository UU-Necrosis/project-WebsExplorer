databases:
  - name: webs-explore-db
    databaseName: webs_explore
    user: webs_explore
    plan: basic-256mb

services:
  - type: web
    name: webs-explore-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: webs-explore-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_REGISTRATION_TOKEN
        generateValue: true